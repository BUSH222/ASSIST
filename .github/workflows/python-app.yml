name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1
  UV_SYSTEM_PYTHON: 0

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: "lint"
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"
      
      - name: Install dependencies (builds the C++ extension)
        run: |
          uv sync --all-groups
          uv pip list
      
      - name: Lint with Ruff
        run: uv run ruff check .
      
      - name: Check formatting with Ruff
        run: uv run ruff format --check .
      
      - name: Type check with ty
        run: uv run ty check .
      
      - name: Verify lock file is up-to-date
        run: |
          uv lock --check
          if [ $? -ne 0 ]; then
            echo "::error::uv.lock is out of date. Run 'uv lock' to update."
            exit 1
          fi

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel (matches the dev machine) is disabled for now: Python setup alone takes ~4 min there.
        # Re-enable with: os: [ubuntu-latest, macos-15-intel]
        os: [ubuntu-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: "test"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies (builds the C++ extension)
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest
