# METEOR-M LRPT: 72 ksym/s OQPSK, RRC alpha 0.6, METEOR CADU framing, on 137.9 MHz, continuous.
# Level `cal: meteor_auto`: the M1 calibration of METEOR-M2 3 (NORAD 57166) or M2-4 (NORAD 59051) for those catalog
# objects, the joint `meteor` calibration otherwise.
platform: satellite
emitters:
  - id: lrpt
    signal: {kind: oqpsk}
    freq_hz: 137.9e6
    level: {cal: meteor_auto}
    pattern: qfh_poly
