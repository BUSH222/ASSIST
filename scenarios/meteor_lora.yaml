# M6 check (plan §11): METEOR-M2 3 and M2-4 LRPT on 137.9 MHz with LoRa on the overlapping channel, 137.9265 MHz.
# Real catalog orbits, back to back: the M2-3 pass (AOS 09:01:23 UTC, 22 deg) then the M2-4 pass (AOS 09:32:24,
# 20 deg). Real METEOR passes do not overlap on 3-5 Nov: M2-4 always follows M2-3 by about 30 min.
# There are no SpaceBEEs in the element snapshots, so ten polar Starlinks (97.3 deg, ~466 km, one per orbital plane,
# RAAN 0..324 deg in 36 deg steps) carry the spacebee preset's LoRa, here on the overlapping channel only.
# STARLINK-4376 (53216) is up during the M2-3 pass (11.5 deg); STARLINK-36816 (67891, 68 deg) and STARLINK-36884
# (68026) during the M2-4 pass.
#   uv run assist passes scenarios/meteor_lora.yaml
#   uv run assist truth  scenarios/meteor_lora.yaml -o out/m6/meteor_lora_truth.csv
#   uv run assist render scenarios/meteor_lora.yaml -o out/m6 --format cu8       # 47 min = 13.5 GB
# Needs the element snapshots in samples/ (local only).
version: 1
seed: 6
clock: {start: "2026-11-03T09:00:00Z", duration: 47min}
profile: profiles/vhf137
elements:
  files: [samples/active.csv, samples/satnogs.csv]
