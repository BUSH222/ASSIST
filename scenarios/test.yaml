# Benchmark scenario (M5): 20 CW carriers plus profile-shaped noise, the worst case for ~20 sources: all 20 are
# above the horizon and on for the whole 8 min clock (12:00-12:08 UTC), so every second synthesises 20 emitters.
# Carriers every 110 kHz from 135.957 to 138.047 MHz (clear of the DC bin at 137.000 MHz), zombie preset
# (45 dB-Hz at zenith, per-pass offset and drift), schedule continuous; the even ones without AM, the odd ones
# with the preset's (7.5 s / 6 dB). Passes rise between 11:54 and 11:58 UTC, 20-77 deg, alternating directions.
# Until M6 there are no modulated signals; station_default.yaml (M9) becomes the full benchmark.
#
# From the repository root:
#   uv run assist bench  scenarios/bench_cw20.yaml                      # 60 s: 1 worker and all CPUs
#   uv run assist bench  scenarios/bench_cw20.yaml --duration 5min --workers 6
#   uv run assist render scenarios/bench_cw20.yaml -o out/bench_cw20    # 8 min, one WAV file
version: 1
seed: 5
clock: {start: "2026-11-04T12:00:00Z", duration: 8min}
profile: profiles/vhf137
sources:
  - id: c00
    preset: zombie
    orbit: {synthetic_pass: {aos: -2min, max_el_deg: 20, direction: desc, side: west}}
    freq_hz: 135.9e6
    schedule: {type: continuous}
    am: null
